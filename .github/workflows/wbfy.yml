name: Willboosterify
on:
  schedule:
    - cron: 44 16 * * *
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
permissions:
  actions: write
  contents: write
jobs:
  wbfy:
    uses: WillBooster/reusable-workflows/.github/workflows/wbfy.yml@main
    with:
      github_hosted_runner: true
    secrets:
      VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
